<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>оформление заказа — доставка и оплата | с?м</title>
  <meta name="description" content="оформление заказа в интернет-магазине с?м: контакты, курьер, пункт выдачи или почта, оплата картой, сбп или при получении. три шага — и заказ твой.">
  <link rel="canonical" href="https://vseleznev54.github.io/I-M-test/checkout.html">
  <meta property="og:title" content="оформление заказа | с?м">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/home/hero-1.jpg">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>
  <div id="chrome-top"></div>

  <div class="container">
    <nav class="breadcrumbs" aria-label="хлебные крошки">
      <span><a href="index.html">главная</a></span>
      <span><a href="cart.html">корзина</a></span>
      <span>оформление заказа</span>
    </nav>

    <h1 class="h1">оформление заказа</h1>

    <ol class="steps" data-steps>
      <li class="steps__item is-active" data-step="1"><b>1</b> контакты</li>
      <li class="steps__item" data-step="2"><b>2</b> доставка</li>
      <li class="steps__item" data-step="3"><b>3</b> оплата</li>
    </ol>

    <div class="co-layout">
      <form class="co-form" data-co-form novalidate>

        <!-- ШАГ 1 — КОНТАКТЫ -->
        <section class="step-panel" data-panel="1">
          <div class="co-auth" data-co-auth hidden>
            <span>войди, чтобы не заполнять — подставим имя, телефон и адреса</span>
            <button class="btn btn--dark btn--sm" type="button" data-open-auth>войти</button>
          </div>
          <h2 class="h3 mb-20">кому отдать заказ</h2>
          <div class="grid-2">
            <label class="field" data-field="name">
              <span>имя *</span>
              <input type="text" name="name" placeholder="алекс" autocomplete="given-name">
              <div class="field__error">без имени курьер не найдёт</div>
            </label>
            <label class="field" data-field="lastName">
              <span>фамилия *</span>
              <input type="text" name="lastName" placeholder="соколов" autocomplete="family-name">
              <div class="field__error">укажи фамилию</div>
            </label>
            <label class="field" data-field="phone">
              <span>телефон *</span>
              <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" autocomplete="tel">
              <div class="field__error">телефон нужен для связи по доставке</div>
            </label>
            <label class="field" data-field="email">
              <span>e-mail *</span>
              <input type="email" name="email" placeholder="alex@example.com" autocomplete="email">
              <div class="field__error">на почту улетит подтверждение заказа</div>
            </label>
          </div>
        </section>

        <!-- ШАГ 2 — ДОСТАВКА -->
        <section class="step-panel" data-panel="2" hidden>
          <h2 class="h3 mb-20">как доставить</h2>
          <div data-delivery></div>
          <label class="field" data-field="city">
            <span>город *</span>
            <select name="city">
              <option value="новосибирск">новосибирск</option>
              <option value="москва">москва</option>
              <option value="санкт-петербург">санкт-петербург</option>
              <option value="томск">томск</option>
              <option value="красноярск">красноярск</option>
              <option value="другой город">другой город</option>
            </select>
            <div class="field__error">выбери город</div>
          </label>
          <div data-addr-box></div>
        </section>

        <!-- ШАГ 3 — ОПЛАТА -->
        <section class="step-panel" data-panel="3" hidden>
          <h2 class="h3 mb-20">чем платим</h2>
          <div data-pay></div>
          <label class="field" data-field="comment">
            <span>комментарий к заказу</span>
            <textarea name="comment" rows="3" placeholder="домофон не работает, звоните — заберу у подъезда"></textarea>
          </label>
          <label class="check co-terms" data-terms>
            <input type="checkbox" name="terms">
            <span class="check__box"></span>
            <span>я согласен(а) с <a href="terms.html">договором оферты</a> и <a href="privacy.html">политикой конфиденциальности</a></span>
          </label>
        </section>

        <div class="step-nav" data-nav>
          <button class="btn btn--outline" type="button" data-back>назад в корзину</button>
          <button class="btn btn--dark" type="submit" data-next>дальше</button>
        </div>
      </form>

      <aside class="summary" data-summary></aside>
    </div>
  </div>

  <div id="chrome-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
