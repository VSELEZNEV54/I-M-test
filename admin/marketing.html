<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>промокоды и акции — админ-панель с?м</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
  <div class="adm" id="adm-root">
    <main class="adm__main" id="adm-main">

      <div class="panel panel--pad0">
        <div class="panel__head">
          <div class="panel__title">промокоды</div>
          <button class="btn btn--sm btn--lime" type="button" data-new-promo>+ создать промокод</button>
        </div>

        <form data-promo-form hidden style="padding:0 22px 18px;border-bottom:1px solid var(--line)">
          <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end">
            <label class="field" style="margin:0"><span>код</span><input type="text" data-p-code placeholder="DROP20" required></label>
            <label class="field" style="margin:0"><span>тип скидки</span>
              <select data-p-type>
                <option value="percent">процент</option>
                <option value="fixed">фикс</option>
              </select>
            </label>
            <label class="field" style="margin:0"><span>размер</span><input type="number" data-p-value value="10" min="1" required></label>
            <label class="field" style="margin:0"><span>мин. сумма, ₽</span><input type="number" data-p-min value="0" min="0" step="100"></label>
            <label class="field" style="margin:0"><span>действует до</span><input type="date" data-p-until value="2026-12-31"></label>
          </div>
          <div style="display:flex;gap:10px;margin-top:14px">
            <button class="btn btn--sm btn--dark" type="submit">создать промокод</button>
            <button class="btn btn--sm btn--ghost" type="button" data-cancel-promo>отмена</button>
          </div>
        </form>

        <div class="table-wrap"><table class="adm-table" data-promos></table></div>
      </div>

      <div class="adm-grid adm-grid--halves mt-20">
        <div class="panel">
          <div class="panel__head">
            <div class="panel__title">автоматические акции</div>
            <button class="btn btn--sm btn--outline" type="button" data-new-action>+ создать акцию</button>
          </div>
          <div data-actions></div>
        </div>

        <div class="panel">
          <div class="panel__head">
            <div class="panel__title">спецпредложения в кабинете</div>
          </div>
          <div data-offers></div>
        </div>
      </div>

      <p class="adm-note mt-20">промокоды из этой таблицы работают в корзине прототипа: SKOLKO15, MOZHNO500 и BUNT10. созданные здесь коды сохраняются локально в вашем браузере — так удобно показывать сценарий клиенту.</p>
    </main>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin-ui.js"></script>
  <script src="../assets/js/admin-marketing.js"></script>
</body>
</html>
