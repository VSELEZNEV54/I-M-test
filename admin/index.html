<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dashboard — админ-панель с?м</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
  <div class="adm" id="adm-root">
    <main class="adm__main" id="adm-main">

      <div class="stats" data-stats></div>

      <div class="adm-grid">
        <div class="panel">
          <div class="panel__head">
            <div class="panel__title">продажи за 14 дней</div>
            <select data-period style="border:1px solid var(--line);padding:8px 10px;font-size:13px;background:var(--paper)">
              <option value="14">последние 14 дней</option>
              <option value="7">последние 7 дней</option>
              <option value="30">последние 30 дней</option>
            </select>
          </div>
          <div data-chart></div>
        </div>
        <div class="panel">
          <div class="panel__head"><div class="panel__title">низкий остаток</div><a class="linklike small" href="products.html">все товары</a></div>
          <div data-lowstock></div>
        </div>
      </div>

      <div class="adm-grid adm-grid--halves mt-20">
        <div class="panel panel--pad0">
          <div class="panel__head"><div class="panel__title">свежие заказы</div><a class="linklike small" href="orders.html">вся база заказов</a></div>
          <div class="table-wrap"><table class="adm-table" data-fresh-orders></table></div>
        </div>
        <div class="panel panel--pad0">
          <div class="panel__head"><div class="panel__title">популярные товары</div><a class="linklike small" href="products.html">управление товарами</a></div>
          <div class="table-wrap"><table class="adm-table" data-top-products></table></div>
        </div>
      </div>

      <p class="adm-note mt-20">это интерактивный прототип админ-панели: данные демонстрационные, изменения статусов и товаров сохраняются локально в вашем браузере.</p>
    </main>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin-ui.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
